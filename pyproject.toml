# https://snarky.ca/what-the-heck-is-pyproject-toml/
[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Telethon"
dynamic = ["version"]
readme = "README.rst"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=46,<47",
    "keyring>=24,<26",
    "mcp>=0.9,<2",
    "rsa==4.9",
]

[tool.setuptools.dynamic]
version = {attr = "telethon.version.__version__"}

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=5,<7",
    "pyaes==1.6.1",
    "ruff",
]

[tool.ruff]
line-length = 127
target-version = "py311"
# Exclude pre-existing Telethon source dirs from lint enforcement.
# CI enforces lint only on Sprint-1-touched files and future mcp_bridge/.
# Future sprints may narrow this list as they add linted code.
exclude = [
    "telethon/",
    "telethon_generator/",
    "telethon_examples/",
    "tests/",
    "readthedocs/",
]

# Format style is advisory only — not enforced in CI.
# Developers may run `ruff format` locally if desired, but it is not required.
[tool.ruff.format]
quote-style = "preserve"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# setup.py: pre-existing style issues (not in exclude list above)
"setup.py" = ["E731", "F841"]

[tool.pytest.ini_options]
markers = [
    "live: tests requiring TELETHON_LIVE_TESTS=1",
    "slow: long-running tests",
]
asyncio_mode = "auto"
