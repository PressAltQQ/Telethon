name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@f94ec6bedd8674c4426838e6b50417d36b6ab231 # v5.1.0
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --frozen --extra dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Run tests
        run: |
          uv run pytest tests/ -m "not live" \
            --cov=telethon \
            --cov-report=term-missing \
            --cov-fail-under=20 \
            -q

      - name: Run tests (mcp_bridge per-scope gate)
        run: |
          # TODO: raise --cov-fail-under to 80 once mcp_bridge coverage rises
          uv run pytest tests/mcp_bridge/ -m "not live" \
            --cov=mcp_bridge \
            --cov-report=term-missing \
            --cov-fail-under=74 \
            -q

      - name: pip-audit (runtime deps only)
        run: |
          uv pip install pip-audit
          uv run pip-audit --strict -r requirements.txt
